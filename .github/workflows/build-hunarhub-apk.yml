name: Build HunarHub Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: frontend
        run: flutter create --platforms=android --project-name hunarhub .

      - name: Add Android Internet permission
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />'

          if "android.permission.INTERNET" not in content:
              position = content.find(">", content.find("<manifest"))
              if position == -1:
                  raise SystemExit("Android manifest is invalid")

              content = content[:position + 1] + "\n" + permission + content[position + 1:]
              path.write_text(content)

          print("Android Internet permission verified.")
          PY

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HunarHub-Android-APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
